l_english: 
 ###### Japan and Shinto #######
 shinto_events.999.t:0 "Shinto in a Changing World"
 shinto_events.999.desc:0 "The Shinto faith is innately tied with Japanese culture and has roots stretching back centuries, but in this recent period of modernization and globalization, roughly once a generation there arises new apparent conflicts between our traditional beliefs and the changing world around us which might drastically shift the way we interact with the world. As the leader of our nation, [Root.Monarch.GetName] must decide how we wish to adapt to the world if we are to preserve our own nature without collapse, or perhaps if we shall abandon the old faith entirely.\n\n§MAll following eligible incidents are listed below. This event will recur as long as there are available incidents and there has not been an incident in the last 30 years.§!"
 shinto_events.999.a:0 "Address the issue of §YNeo-Confucianism.§!"
 shinto_events.999.b:0 "Address the issue of the §YNanban Trade.§!"
 shinto_events.999.c:0 "Address the issue of §YProliferation of Firearms.§!"
 shinto_events.999.d:0 "Address the issue of the §YSpread of Christianity.§!"
 shinto_events.999.e:0 "Address the issue of §Yising Shogunate Authority.§!"  
 shinto_events.999.f:0 "Address the issue of the §YIkko-Ikki." 
 shinto_events.999.g:0 "Address the issue of the §YWokou Pirates.§!"
 shinto_events.999.h:0 "Address the issue of Urbanization."  
 uu_incident_manager_tt:0 "§GThe relevant Incident will become eligible to fire.§!"

 ########################################################################
 # UU Japan Missions #
 ########################################################################

 #taken from vanilla
 uujap_pacify_the_north_title:0 "Pacify the North"
  uujap_pacify_the_north_desc:0 "The people of Ezochi are a thorn in our side, operating as a base for brigands who come south to hound our peaceful subjects. We must extend our benevolent rule north to this wild land, and ensure that the people there learn the benefits of our ways."
 uujap_take_the_thousand_islands_title:0 "Take the Kurils"
  uujap_take_the_thousand_islands_desc:0 "The Son of Heaven requests that the islands to the north of Japan be settled with landless Ronin for the peace of the Emperor."
 uujap_siberian_intervention_title:0 "Siberian Intervention"
  uujap_siberian_intervention_desc:0 "Our involvement in Manchuria and among the Thousand Islands requires a new defensive frontier. The taigas of Siberia may not be the most alluring of lands, but they will provide a good first line of defense against anyone from the west who wishes to attack our more prosperous territories."
 uujap_sankin_kotai_title:0 "Sankin-Kotai"
  uujap_sankin_kotai_desc:0 "Rather than simply imprison the worst lords and risk rebellion, we can take a far more subtle approach to weakening and integrating them by obligating them to visit the capital regularly. Implementing a policy of 'alternate attendance' would compel the lords to maintain two residencies, one in their own domains and one in the capital, and of course they would be expected to travel back and forth in extravagant processions. The cost of all this would bankrupt all but the wealthiest lords, preventing them from accumulating the funds they would need to maintain a private army. It would also help bolster our own power in the capital, and make it a far more attractive place for courtiers and diplomats."
 uujap_emperor_of_china_title:0 "Imperial Mandate"
  uujap_emperor_of_china_desc:0 "We were once called 'dwarfs' by China, but now China is dwarfed by us! The Son of Heaven has no equal; we must assert the Chrysanthemum Throne's supremacy over all other rulers."
 uujap_the_divine_wind_title:0 "The Divine Wind"
  uujap_the_divine_wind_desc:0 "Many years have passed since the Divine Wind blew an invading Mongol army away from Japan, and saved the Motherland from foreign invasion. In the future, perhaps we should be better prepared?"
 uujap_establish_political_supremacy_title:0 "Win Political Supremacy"
  uujap_establish_political_supremacy_desc:0 "Our aspirations are greater than any mere daimyo's. It is our duty, our destiny, to reach the highest levels of power in the land."
 uujap_balance_the_four_divisions_title:0 "Balance the Four Divisions"
  uujap_balance_the_four_divisions_desc:0 "Society is divided into four parts, which need to be in perfect balance to create a truly harmonious society. This period of ours is sadly one of gekokujo, where even the lowest can overcome the highest in society. We must find a way to remedy this grievous ill and restore harmony."
 uujap_colonize_taiwan_title:0 "Colonize Taiwan"
  uujap_colonize_taiwan_desc:0 "In order to stand strong, Japan must grow. The uncolonized island of Taiwan to the south seems like a good candidate."
 
 #new
 uujap_build_army_mission_title:0 "Prepare the Army"
  uujap_build_army_mission_desc:0 "The Sengoku Jidai is upon us. We must prepare to lead our armies to defend our domain, or preemptively cut down our threatening neighbours."
 uujap_alaska_title:0 "Into the Sunrise"
  uujap_alaska_desc:0 "The inhabitants of Siberia tell us of another land to the East, across the great sea, towards the sunrise. If there are riches to be gained from settling this new land, we must explore it and find them."
 uujap_empire_rising_sun_title:0 "Empire of the Rising Sun"
  uujap_empire_rising_sun_desc:0 "Our empire stretches from coast to coast across the great waters, the eastern terminus of the Known World. We are known as the Land of the Rising Sun, but now our dominion stretches even onto this new continent, towards the Rising Sun. Let us improve the infrastructure of these faraway colonies and connect them to our networks so that we may truly become a modern global empire, the Empire of the Rising Sun."
 uujap_south_china_title:0 "Control Southern China"
  uujap_south_china_desc:0 "Now that the Chinese Empire has been sufficiently crippled, they can no longer try to assert their pretend superiority on us. Now, we must move to secure the centers of power in the region to cement our control, and ensure the Chinese may never rise again."
 uujap_malacca_strait_title:0 "Malay Trade"
  uujap_malacca_strait_desc:0 "We now find ourselves in prime position to take advantage of the rich markets of Malaya. We should try to establish ourselves in this region, and gain a commanding position over the great volume of commerce that passes through the region."
 uujap_expand_the_domain_title:0 "Domain Expansion"
  uujap_expand_the_domain_desc:0 "Our clan's ancestral domain will no longer suffice in such an era of warfare. If we are to survive, we must expand our domain to prevent annexation."
 uujap_conquer_ryukyu_title:0 "Kingdom of Ryukyu"
  uujap_conquer_ryukyu_desc:0 "As tributaries of the Chinese Emperor, the kings of Ryukyu enjoy strong relations with the merchants of the Sinosphere and can trade in many ports in Southeast Asia. Taking hold of this strategic juncture may be difficult, but it would serve as a springboard into other commercial affairs further south, and undermine the power of the Chinese."
 uujap_philippines_title:0 "Another Archipelago"
  uujap_philippines_desc:0 "The islands to our south are home to a number of exotic trade goods that we cannot grow in Japan. It would be advantageous to take control of this region and extend our influence in the South China Sea."
 uujap_spice_islands_title:0 "The Spice Islands"
  uujap_spice_islands_desc:0 "The most valuable of the spices are Cloves, grown only in select regions of the world. The most prolific clove-growing region is within our reach, let us secure its supply to take control of its lucrative market."
 uujap_capture_emperor_title:0 "Capture the Emperor"
  uujap_capture_emperor_desc:0 "The legitimacy and authority of the Shogun derives from the Emperor. Without the assent of the Emperor, the Shogun holds no power. To truly gain power over the other daimyo, we must capture the Emperor and convince him that our leader is better suited for the role of Shogun."
 uujap_samurai_title:0 "The Samurai Caste"
  uujap_samurai_desc:0 "The Samurai are Japan's famed warrior nobility class. However, as Japan is now united, the nature of a samurai must adapt to a more domestically peaceful era."
 uujap_issue_new_coin_title:0 "Issue New Coins"
  uujap_issue_new_coin_desc:0 "All across Japan, there is a shortage of coins as economies grow and spending increases. We will have to find a solution if our markets are to continue functioning, and our army is to be paid."
 uujap_permit_money_changers_title:0 "Ginza Money Changers"
  uujap_permit_money_changers_desc:0 "The varying qualities of our coins poses complications for commerce in our lands. If we permit the formation of specific guilds - Ginza - to appraise, exchange, and mint coins of different materials on behalf of the government at a floating exchange rate, the economy should flow more freely as a result."
 uujap_gokaido_title:0 "The Five Highways"
  uujap_gokaido_desc:0 "Because of our policy of Sankin-Kotai, traffic between the capital and the outer provinces has increased, with our vassals needing to make the journey more often. To protect them, we must invest in paved roads and infrastructure to keep travellers safe on their journeys to and from the capital. There will be five great highways, which we will call the Gokaido, which will extend outwards from the capital and connect to the most important provinces."
 uujap_rice_brokers_title:0 "The Rice Broker System"
  uujap_rice_brokers_desc:0 "Rice is the only common currency between the daimyo. Recently, rice brokers have begun to exchange rice for paper money - perhaps we should invest into this system to potentially grow the economy."
 uujap_new_capital_mission_title:0 "The Shogun's Capital"
  uujap_new_capital_mission_desc:0 "Now that our control over Japan is secured, there is no more need to operate out of Kyoto where the Emperor resides. The Shogun has already moved his base of operations to Edo Castle in the province of Musashi, a strategically important location surrounded by flat ground and a natural harbour. We must build this area up into a new capital to equal, or even surpass, Kyoto."
 uujap_fate_emperor_title:0 "The Balance of Power"
  uujap_fate_emperor_desc:0 "The world is changing rapidly. In this age of absolute monarchies, it is time for us to consolidate our rule, and we will strive to overcome the challenges of any who might stand in our way."
 uujap_secure_authority_title:0 "Secure Authority"
  uujap_secure_authority_desc:0 "The struggle is over, and a victor has emerged. It is time for Japan's real ruler to assume absolute control."
 uujap_dejima_title:0 "The Island Port of Dejima"
  uujap_dejima_desc:0 "With contact established with the nations of the West and trade soon to follow, we should restrict foreign business to a specific designated area, allowing us to control the flow of foreign goods and ideas into our country. Plans have been drawn up to create an artificial island from a peninsula near Nagasaki, which we will call Dejima."
 uujap_atakebune_title:0 "Atakebune Warfare"
  uujap_atakebune_desc:0 "The Warring States period created an environment of huge naval investment throughout Japan, as every daimyo strove for naval supremacy. Thus was born the Atakebune, large oar-powered coastal warships big enough to transport armies and to carry limited amounts of cannon."
 uujap_religious_harmony_title:0 "Internal Harmony"
  uujap_religious_harmony_desc:0 "For our country to truly be united, there must be no division along religious lines in our country. We have explored our religious options thoroughly, and now we must restore harmony."
 uujap_all_incidents_title:0 "Shinto in a Modern World"
  uujap_all_incidents_desc:0 "The Shinto faith is innately entwined with Japanese culture, but the changing world around us has forced us to reconsider the way we interact with it. The Shinto faith of the modern world is surely something much different from it was only a few centuries ago."
 uujap_attack_korea_title:0 "Invasion of Korea"
  uujap_attack_korea_desc:0 "Korea has long been a knife aimed at Japan's throat. It's time for us to finally cross the sea and establish a strong and secure presence in the peninsula."
 uujap_manchuria_title:0 "Control Manchuria"
  uujap_manchuria_desc:0 "The Jurchens of Manchuria have thus far been tolerant of the Chinese yoke, but it is clear the yoke has begun to chafe. If we were to grow our influence and control of the region, there might be something to be gained for both us and the Manchurians."
 uujap_tanegashima_guns_title:0 "Tanegashima's Matchlocks"
  uujap_tanegashima_guns_desc:0 "The new type of matchlock arquebus fabricated copying the ones recovered from the island of Tanegashima have proved to be a great improvement for all our armies. We must expand their production even further, so that we have more guns than any other country."
 #Events 
 uujap_events.1.t:0 "The Issue of Coins, and the Issue Thereof"
  uujap_events.1.desc:0 "For centuries, the main source of coinage in Japan was via import from China. However, the natural demand for coins as the local Japanese population and economy grew, combined with the public reluctance to accept as well as increased expenditures on military affairs meant that by the mid-16th century, the imported coins were no longer enough to sustain the growing economy. Government decrees of Erizeni-Rei (prohibiting the act of Erizeni, or the act of not accepting low-quality coinage) proved ineffective in forcing circulation of the increasingly devalued currency, and many domains took to minting their own gold coinage. A notable example is the Takeda clan of the late 16th century, whose mints and coins were later taken over by the victorious Tokugawa shogunate."
  uujap_events.1.a:0 "We simply need to enforce Erizeni-Rei to see results."
  uujap_events.1.b:0 "Just mint more coins."
 uujap_events.2.t:0 "The Dojima Rice Exchange"
  uujap_events.2.desc:0 "As the various daimyo of Japan usually had their own coinage, the mandatory travels to the capital under the Sankin-kotai system became complicated affairs of currency exchange to pay for room and board in the lands they crossed. The unifying currency among the daimyo was rice, which they received as income from their domains. Eventually, a network of rice brokers - fudasashi - arose, who would purchase the daimyo's rice and issue them paper bills in exchange (Japan's first paper currency), which merchants could then accept and exchange with the brokers for rice. Centered in Osaka, which by this point was the most important city in Japan for the exchange of goods, the rice brokers were the precursor to the Japanese modern banking system, as they began to loan paper money with interest. The ensuing Genroku period (1688-1704) was a time of unheralded prosperity for the Japanese merchant class, with the rice brokers and money-changers gathering in Osaka, and the Dojima Rice exchange was given an official government license in 1697. Eventually, when the system began to fail, the Shogunate stepped in and organized the rice brokers under it, providing means for the government to stabilize the monetary policy."
  uujap_events.2.a:0 "Chasing our debtors is not important, the economy is booming!"
  uujap_events.2.b:0 "Such reckless policy will only cause problems later."
 uujap_events.3.t:0 "The Fall of Beijing"
  uujap_events.3.desc:0 "It seems a new power has risen in the East, with the might to rival China. The perennial failure to check Japanese control over Manchuria has finally borne bitter fruit, and already they have breached the Great Wall and have captured Beijing, the Northern Capital. The Manchurians follow the orders of the Japanese Shogun in lockstep, and they marshal their hostile forces freely where once the banners of the Ming proudly flew. This can be nothing other than a precursor to a full-scale invasion of China."
  uujap_events.3.a:0 "Ok."
 uujap_events.4.t:0 "Manchuria, at a Cost"
  uujap_events.4.desc:0 "With the help of our Japanese allies, we have managed to take hold of our homeland, however we had to make many concessions for it. Now, the Japanese have gained a lot of influence over our government, and are asking for their debts to be repaid. We stand to gain a lot of legitimacy and undoubtedly a powerful supporter against China, but we also have no choice."
  uujap_events.4.a:0 "Ok."  
 uujap_events.5.t:0 "The Surrender of Ryukyu"
  uujap_events.5.desc:0 "We have managed to secure control of the Ryukyu kingdom in its entirety. Upon our landing, the Ryukyuan king astutely realized that resistance was futile, and ordered his men to surrender. The king himself was swiftly captured, and now awaits transfer to Kagoshima.\n\nHowever, the Ryukyu kingdom has traditionally been under the protection of the Chinese emperor, who would surely take it as a grave insult were we to simply annex the kingdom; however, the Ryukyuans have offered to pay us tribute and grant us effective control over the island if we leave them be, and since we have the Ryukyuan royal family in custody, we would effectively gain indefinite control of Ryukyu without the Chinese even suspecting a difference."
  uujap_events.5.a:0 "As long as the Ryukyuans know who's really in charge..."
  uujap_events.5.b:0 "We do not care for the empty words of a decrepit dragon." 
 uujap_events.6.t:0 "The Samurai Caste"
  uujap_events.6.desc:0 "The Samurai are the renowned Japanese warrior nobility, but as they were generally not landed nobility, they received a stipend from their lord, although this could vary greatly based on rank. With Japan now consolidated and pacified, there has of late been less need for an elite class of warriors, and while high-ranking samurai have largely found work as bureaucrats, many low-ranking samurai now earn not much more than subsistence wages as guardsmen or messengers.\n\nThe social classes of feudal Japan have traditionally been rigid, with positions in the samurai class being largely hereditary. However, with sumptuary laws forcing the nobility to spend to maintain outward prestige, many samurai have become impoverished and indebted to the growing merchant class. As the need for samurai diminishes, some impoverished samurai have offered to adopt wealthy townsmen and peasants for money, effectively allowing a samurai rank and stipend to be inherited by the lower class, albeit those wealthy enough to display the prestige befitting the rank of samurai."
  uujap_events.6.a:0 "Ban this practice, the prestige of the samurai must not be diluted."
  uujap_events.6.b:0 "It is better if less samurai are impoverished."

 uujap_events.99.t:0 "Bakumatsu?"
  uujap_events.99.desc:0 "Recent government policies have recently led to hardships among the lower strata of Japan, as well as great social inequality. All the while, the government has increased efforts to centralize power and make their rule more and more absolute, Elsewhere, as the world becomes increasingly interconnected with global trade, more and more foreign powers have begun to take an interest in Japan, and the long-passive emperor has begun to develop his own opinions on the matter. Only time will tell whether the Shogunate will succeed in its endeavours, or whether it will be toppled by some other internal pressures."
  uujap_events.99.a:0 "The shogun has many supporters in the capital..."
  uujap_events.99.b:0 "...but not everyone in the capital is thus inclined..."
 uujap_events.100.t:0 "Oshio Heihachiro's Revolt"
  uujap_events.100.desc:0 "Born into a high-ranking samurai family, Oshio Heihachiro was a police inspector in Osaka before retiring and founding a private philosophy school. However, despite his high standing, he was not insulated from the problems of the poor. When famine struck the historically prosperous Kansai region, the region of Kyoto and Osaka, food prices skyrocketed and the starving public began to riot in the cities. Oshio sought to appeal to his powerful and wealthy peers to alleviate the suffering of the populace, but when he realized they would rather exploit the situation for their own gain, he lost his faith in the establishment and began a plot to forcibly seize the government's food stores and distribute it to the hungry public.\n\nUltimately, the rebellion was a failure, and Oshio immolated himself rather than submit to the authorities. Nevertheless, the message was clear: the popular unrest had reached even the members of the aristocracy, and this would not be the last rebellion if the government did not act swiftly."
  uujap_events.100.a:0 "Crucify his supporters to send a message to any future rebels."
  uujap_events.100.b:0 "Pressure the upper classes to help relieve the starving."
 uujap_events.101.t:0 "The Emperor Speaks Out"
  uujap_events.101.desc:0 "Recently, our diplomats have concluded a treaty with one of our diplomatic partners that some have been calling humiliating with its many concessions, and the treaty has become very unpopular domestically. Even the Emperor, who traditionally would refrain from taking part in politics, has spoken out openly against the treaty and is refusing to give it his approval. This troubling development has led some to question the authority of the Shogun, whose mandate is derived from imperial sanction. Many in the Shogun's court still believe the treaty to be the best course of action for Japan, but openly defying the Emperor's wishes would undoubtedly cause our legitimacy to be shaken."
  uujap_events.101.a:0 "The Emperor is an outdated figurehead, we know what's best."
  uujap_events.101.b:0 "We must accede to the Emperor's wishes, for our own legitimacy."
 uujap_events.102.t:0 "The Ansei Purges"
  uujap_events.102.desc:0 "The Emperor's increasing interference in our affairs has caused two opposing political movements to develop: the 'Revere the Emperor' faction with loyalty to the Emperor above all others, and the 'Unity of Court and Shogun' faction in opposition to it advocating for the Emperor to act in line with the Shogun. In response to the increasing discontent with the shogunate's rule in these tumultuous times, and particularly the most recent attempts by the Emperor's supporters to influence the succession of the Shogun, our Senior Minister has suggested that the Bakufu be purged of all Imperial loyalists to cement our control and weaken the Emperor's attempts to undermine us."
  uujap_events.102.a:0 "Only make a few inoffensive arrests."
  uujap_events.102.b:0 "Arrest them all."
 uujap_events.103.t:0 "A Member of Our Family is Pro-Restoration"
  uujap_events.103.desc:0 "It seems the unrest has penetrated even within the Shogun's own family. One of the Shogun's relatives has become an ardent supporter of the 'Revere the Emperor' faction, which now openly advocates for the overthrow of the established Shogunate and the restoration of Imperial rule as in the 14th century. This relative has published writings opposing our foreign policy efforts and encouraging military buildup, and recently pushed for his own son to succeed the current Shogun, no doubt with the Emperor's meddling assent. Though he is a prominent member of the family and an important government official, his actions are proving disruptive to the government's authority."
  uujap_events.103.a:0 "He is part of the family, he cannot be touched."
  uujap_events.103.b:0 "Throw him under house arrest as well."
 uujap_events.104.t:0 "The Emperor's Supporters Cause International Incident"
  uujap_events.104.desc:0 "A local daimyo, a supporter of the 'Revere the Emperor' faction, recently caused an international incident by killing a foreign national who disrespected them, as well as firing upon the ships of foreign powers in Japanese waters in the name of the Emperor. These foreign countries are understandably outraged at the incident and have taken military action against this daimyo by firing cannon upon his cities in a clear violation of our territorial integrity. However, it seems in this case, the Emperor is in agreement with us that the daimyo has gone too far."
  uujap_events.104.a:0 "We must stand behind our subjects in solidarity."
  uujap_events.104.b:0 "The Imperial court must stand behind us in solidarity."
 uujap_events.105.t:0 "The Emperor, Dead"
  uujap_events.105.desc:0 "Purple spots and lesions, violent vomiting, a raging fever.\n\nMerely a month ago, the Emperor was holding court and issuing proclamations. But now, he lies dead and buried, struck down by smallpox at the young age of thirty-five. Though the reprieve from his incessant interference is undoubtedly welcome amongst our supporters, the timing of the Emperor's demise was also at a suspiciously convenient time for us. Already, supporters of the Emperor's faction are moving to influence his young son - the new Emperor, and a grieving but impressionable boy of fourteen - against us. As of right now, his intentions are hidden from us, but if we do not act we could soon find ourselves facing another formidable political opponent on the Chrysanthemum Throne."
  uujap_events.105.a:0 "We need to stabilize the country first."
  uujap_events.105.b:0 "Spend our resources to counteract their influence." 
 uujap_events.110.t:0 "Local Daimyo's Loyalty Wavers" 
  uujap_events.110.desc:0 "Reports tell us that one of our vassals, a landholder in the province of [uujap_support_target.GetName], has become influenced by the emperor's supporters. We must decide whether this is something worth dealing with."
  uujap_events.110.a:0 "Not worth our time."
  uujap_events.110.b:0 "Bolster our supporters in his court."

 uujap_events.120.t:0 "Triumph of the Shogunate"
  uujap_events.120.desc:0 "The past few years have been tumultuous, but the institution of the Shogunate has proven more than capable of handling it. The young emperor seems less than eager to engage in national politics in the way that his predecessor did, and the supporters of the Restoration have slowly become quieter after seeing the futility of their struggle. With full imperial support, the Shogunate is stronger than ever, with more control than ever, and is in a great position to lead Japan into the next era and beyond."
  uujap_events.120.a:0 "This is a great day for Japan."
 uujap_events.121.t:0 "Go-Isshin: Honorable Restoration"
  uujap_events.121.desc:0 "The past few years have been tumultuous, but the institution of the Shogunate has at last crumbled under the pressure of the popular movement for change. With his efforts at reform failing, Shogun [Root.Monarch.GetName] resigned from his position and put his prerogatives at the Emperor's disposal, officially marking the end of the $DYNASTY$ Shogunate. The young emperor, hungry for political power as his father was, stripped the former shogun of all his powers shortly afterwards, abolishing the shogunate and its outdated feudal systems, and assumed his rightful position as holder of supreme authority over all Japan, to the joy of his many supporters."
  uujap_events.121.a:0 "This is a great day for Japan."
 uujap_events.122.t:0 "Overlord Demands Our Annexation"  #Mostly for AI
  uujap_events.122.desc:0 "The Shogunate has fallen and the Emperor is now in charge. He has abolished the daimyo system and ordered our incorporation at once."
  uujap_events.122.a:0 "Ok."
  uujap_events.122.b:0 "No."
 uujap_events.123.t:0 "A New Capital?"
  uujap_events.123.desc:0 "The Shogun's choice of Edo as his de facto capital was no act of chance. The Kanto plain is a much larger expanse of flat land than the Kyoto basin, and centuries of infrastructure already exist there. Indeed, many are advocating that the Emperor take advantage of this and move the capital there. This would not only be a symbolic destruction of the Shogunate's influence by repurposing all of his castles and buildings for the new Imperial palaces, but the city itself also promises to be a much more advantageous position from which to rule a nascent Japanese Empire."
  uujap_events.123.a:0 "We shall call it Tokyo - the Eastern Capital."
  uujap_events.123.b:0 "Kyoto is already a fine and storied city."
 #Tooltips
 uujap_eventopt_tt_a:0 "§MThe event will give you the choice between:\nOption A:§!"
 uujap_eventopt_tt_b:0 "§MOption B:§!"
 uujap_spawned_gold_mission_tt:0 "§GIf we are the first to complete this mission, we will receive the following reward in a random Gold province, or the capital if we own no Gold provinces:§!"
 uujap_gokaido_tt:0 "§GAll of the aforementioned provinces will gain the following reward:§!"
 uujap_manchurian_client_state_tt:0 "If any allied Manchurian nation fulfils the conditions, they will become our loyal §YMarch§! and become the nation of @MCH §Y[MCH.GetName]§!."
 uujap_stabhit_chinese_tt:0 "Every known country with their capital in the §YChina§! subcontinent or §YKorea§! region which is not allied or subject to us will gain §R-1§! Stability."
 uujap_permaclaim_malacca_cot_tt:0 "Gain permanent claims on every Center of Trade in the §YMalacca§! trade node."
 uujap_porcelain_tower_buff_tt:0 "Unlocks the conditional modifier in the §YPorcelain Tower of Nanjing§! Great Project, granting us §Gadditional governing capacity§! and §Greduced separatism§!."
 uujap_unlock_better_doctrine_tt:0 "Upgrades the §YAtakebune§! naval doctrine to allow the construction of Tekkousen - early ironclads (reskinned §YGalleasses§!) in provinces with §YShipyards§! or §YDocks§!."
 uujap_shogunate_get_buff_tt:0 "If we take this decision while having the §YShogunate§! reform enacted after starting as a §YDaimyo§!, we will gain the following modifier:"
 uujap_prepare_sneakattack_ryukyu_tt:0 "If we complete this mission by fulfilling the third set of requirements, the resources will be consumed to launch an §Mexpeditionary force§! to capture §YOkinawa§! without the Chinese noticing."
 uujap_annex_ryu_unlock_decision_tt:0 "§lWe will gain a decision to annex Ryukyu whenever we want, which will also trigger the effects of the second option, while removing the permanent modifier we gain from this event.§!"
 uujap_samurai_from_weapons_dev_tt:0 "Developing provinces with §YWeapons Manufactories§! in the §YJapan§! region will have a §Y50%§! chance of spawning a §YSamurai§! regiment on the province."

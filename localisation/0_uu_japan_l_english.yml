 uujap_all_incidents_unlock_decision_tt:0 "We will unlock a decision to §Madjust our own Isolationism§! at the cost of Stability every 30 years."
 uujap_begin_centralizing_tt:0 "§OWe will begin the process of centralizing ultimate power in the office of Shogun by tackling social issues.§!\nThis will start an event chain which will either lead to the §MShogunate strengthening its control§! over Japan, or the §MEmperor of Japan being restored§! to ultimate power."

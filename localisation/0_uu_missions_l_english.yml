 #Mission Unlocks
  #Shinto Isolationism Decisions
 uu_iso_plus_title:0 "(§Y+Isolationism§!) Tighten Migration Restrictions"
  uu_iso_plus_desc:0 "By placing more limitations on who can enter and leave the country as well as on foreign trade and relations, we can adopt a more Isolationist foreign policy."
 uu_iso_minus_title:0 "(§Y-Isolationism§!) Relax Migration Restrictions"
  uu_iso_minus_desc:0 "By repealing limitations on who can enter and leave the country as well as on foreign trade and relations, we can adopt a more Open foreign policy."
 shinto_incident_recent_tooltip_uu2:0 "At least 30 years since last incident, or since last change in Isolationism"
  #Ryukyu Decision
 uujap_annex_ryu_decision_title:0 "@JAP Annexation of the Ryukyus"
  uujap_annex_ryu_decision_desc:0 "The time has come to integrate the Kingdom of Ryukyu into our own realm, and abandon the pretense of sharing it with the Chinese."
  #Atakebune Naval Doctrine 
 japanese_atakebune_2:0 "Atakebune (Ironclad)" 
  japanese_atakebune_2_desc:0 "What is a ship worth if it gets sunk within the first hour of a naval battle? The Atakebune, the warship design of our navy, is designed with this question in mind and is more a fortress on the sea than a sinkable ship."
  #Government Reform
 uu_shogunate_vs_monarchy_reform:0 "Struggle for Japan"
  uu_shogunate_vs_monarchy_reform_desc:0 "The supporters of the Shogunate, which is trying to assert its absolute authority, are in conflict with the Emperor's supporters, who seek to restore the Emperor to power."
  ability_shogunate_vs_monarchy_mechanic:0 "Bakufu vs. Imperial Court"
   uu_shogun_power:0 "Balance of Power"
    uu_shogun_power_desc:0 "The Balance of Power between the Bakufu (the Shogun's government, towards §Y-100§!) and the Imperial Court (the Emperor's supporters, towards §Y+100§!) will change dependent on your choice in events.\n\nAt §Y+100§! we gain the following effects:\n    Maximum Absolutism: §G+50.00§!\n    Yearly Absolutism: §G+2.00§!\n    Liberty Desire from Subjects Development: §G-33.0%§!\n    Tolerance of the True Faith: §G+2.00§!\n    Reform Progress Growth: §G+30.0%\n    Diplomatic Annexation Cost: §G-20.0%§!\n\nAt §Y-100§! we gain the following effects:\n    Maximum Absolutism: §G+50.00§!\n    Yearly Absolutism: §G+2.00§!\n    Liberty Desire in Same Continent Subjects: §G-33.0%§!\n    Income from Vassals: §G+33.3%§!\n    Monthly Autonomy Change: §G-0.05§!\n    Yearly Army Tradition Decay: §G-1.0%§!\n    "
 uu_meiji_constitution_reform:0 "Meiji Constitution" 
  uu_meiji_constitution_reform_desc:0 "The Constitution of the Empire of Japan, known informally as the Meiji Constitution, provided for a form of mixed constitutional and absolute monarchy, based jointly on the German and British models. Under the Meiji Constitution, the Emperor of Japan was an active ruler and wielded considerable political power over foreign policy and diplomacy which was shared with an elected bicameral parliament."

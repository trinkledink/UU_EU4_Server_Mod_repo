 UU_elbian_core_title:0 "Strengthen the Core"
  UU_elbian_core_desc:0 "After establishing our claims, we should rightfully unite the remaining Saxons"
 UU_elbian_reclaim_ancestral_lands_title:0 "Reclaim Ancestral Land"
  UU_elbian_reclaim_ancestral_lands_desc:0 "We became a leading force in the Empire and united the Saxons under our banner"
 UU_natural_borders_title:0 "Our Natural Borders"
  UU_natural_borders_desc:0 "After decades of conquest we established some sort of international acknowledged borders of the Elbian Confederacy. We should take our time to fortify them and enjoy the prosperity these lands give to our people."
 elb_integrate_brandenburg_title:0 "Integrate Brandenburg"
  elb_integrate_brandenburg_desc:0 " "
 elb_berlin_war_academy_title:0 "Berlin Military Academy"
  elb_berlin_war_academy_desc:0 " "
 elb_hamburg_world_port_title:0 "Hamburg World Port"
  elb_hamburg_world_port_desc:0 "We can make Hamburg our gate to the new world and contest the other European powers"
 elb_found_universites_title:0 "Found Universities"
  elb_found_universites_desc:0 "As a powerful court unchained by the pope, we should invest into further progressing our nation"
 elb_weimar_classicism_title:0 "Weimar Classicism"
  elb_weimar_classicism_desc:0 "The poets and authors from Weimar are world-renowned during this time!"
 elb_cheb_gold_mining_title:0 "Cheb Gold Mining"
  elb_cheb_gold_mining_desc:0 "With modernized mining tools we can exploit the Gold Mine in Cheb further"
 elb_master_craftsmanship_title:0 "Master Craftsmanship"
  elb_master_craftsmanship_desc:0 "Craftsman from all over the world flock to our country to learn our ways of handcraftsmanship"
 elb_promote_workshops_title:0 "Promote Workshops"
  elb_promote_workshops_desc:0 "We can enhance our nation's progression by providing more urban workplaces" 
 elb_protect_guild_rights_title:0 "Protect Guild Rights"
  elb_protect_guild_rights_desc:0 "Leaving the City Guilds under estate leadership will make our workshops more efficient"
 elb_beacon_of_progress_title:0 "Beacon of Progress"
  elb_beacon_of_progress_desc:0 "For all future our nation shall be looked up upon for the latest innovations!"
  elb_beacon_of_progress_tt:0 "For the rest of the game, whenever an §YAdvisor§! or an §Yinnovative event§! happens we will have a new option to instead develop one of our provinces by §G9 Development§!" 
  elb_beacon_of_progress_option:0 "Use this genius to develop our cities instead"
  elb_conquest_tt:0 "We will §Greduce§! the §Yautonomy and devastation§! in newly acquired cores that we had a §Yclaim§! on"
 elb_sax_manufacturing_title:0 "Saxon Manufacturing"
  elb_sax_manufacturing_desc:0 " "
 elb_sax_meissen_porcelain_title:0 "Porcelain from Meissen"
  elb_sax_meissen_porcelain_desc:0 " "
 elb_boh_bohemian_crystal_title:0 "Bohemian Crystal"
  elb_boh_bohemian_crystal_desc:0 " "
  unlock_privilege_estate_burghers_elb_improved_workshops_tt:0 "Unlock a new Burgher §YEstate Privilege§! that improves our §Yworkshops§! by §G20%§! "
 elb_embraced_reformation:0 "Embraced Reformation"
  elb_leading_the_league:0 "Leading the League"
 elb_embrace_reformation_title:0 "Embrace the Reformation"
  elb_embrace_reformation_desc:0 "We have to make sure that the word of the Pope serves no meaning to people within our borders"
 elb_lead_the_league_title:0 "Lead the League"
  elb_lead_the_league_desc:0 "We have to take matters into our own hands to ensure the integrity of the Holy Roman Empire"
 elb_lead_the_empire_title:0 "Lead the Empire"
  elb_lead_the_empire_desc:0 "We have been triumphant! The Empire now follows us"

 #Events
 UU_elb_mission_events.1.t:0 "The Hamburg World Port"
  UU_elb_mission_events.1.d:0 "The Port of Hamburg became of ever increasing importance and under our rule it reached it's peak. We now have the chance to establish colonies on our own and contest with the other colonizers or impose strict market regulations to stop the flood of cheap imports"
  UU_elb_mission_events.1.a:0 "Colonial is the way!"
  UU_elb_mission_events.1.b:0 "Mercantilism is right!"
 UU_elb_mission_events.2.t:0 "The Czechs and the Germans"
  UU_elb_mission_events.2.d:0 "For centuries, we have been a non-German kingdom in a German Empire. Our distinct identity has been a source of national pride, and to that end we have successfully managed to defy assimilation and preserve our unique culture, despite extensive dealings with the Germans. That being said, what was once almost exclusively a realm of Czechs has now expanded to include a sizeable population of Germans. With our recent confederation with the like-minded neighbouring Saxon states, our 'distinct' identity has become more dilute with every passing year. The question now arises with increasing frequency whether now is the time to finally begin the process of assimilating, if only to gain favour with our increasingly large German minority. However, this risks alienating many traditional Czechs who will see this as the first step towards the final death of Czech independence."
  UU_elb_mission_events.2.a:0 "The times are changing. We are a new nation, and we will create a new national identity."
  UU_elb_mission_events.2.b:0 "Let the passage of time take its course. Let us not fight the inevitable."
  UU_elb_mission_events.2.c:0 "We are not Germans and we will never be!"
 UU_elb_mission_events.3.t:0 "The Assimilation of the Czechs"
  UU_elb_mission_events.3.d:0 "For centuries, the Kingdom of Bohemia was a non-German kingdom in a German Empire. Their distinct identity was a source of national pride, and to that end the Czechs successfully managed to defy assimilation and preserve their unique culture, despite extensive dealings with the Germans. That being said, our recent confederation of the Bohemian lands into not just a union of two kingdoms, but a unified centralized state of equals, means that the two cultures have begun to intermingle and blend in a way they never have before. The question now arises with increasing frequency whether now is the time to finally begin the process of assimilating, to finally bring the lands of Bohemia into the German fold. However, with the vast German majority sure to cause more influence on the Czechs than vice versa, this risks alienating many traditional Czechs who will see this as the first step towards the final death of Czech independence."
  UU_elb_mission_events.3.a:0 "Give this natural assimilation our official support."
  UU_elb_mission_events.3.b:0 "Let the Czechs keep their identity, for the good of the nation."
  UU_elb_mission_events.3.c:0 "The times are changing. We are a new nation, and we will create a new national identity."
 UU_elb_mission_events.4.t:0 "The Assimilation of the Czechs"
  UU_elb_mission_events.4.da:0 "As time passes and the Czechs integrate into our nation with tacit government support, the censuses increasingly show more regions identifying closer to Germanic than Slavic peoples."
  UU_elb_mission_events.4.db:0 "As time passes and the Czechs continue to adopt more Germanic cultural traditions, the censuses increasingly show more regions identifying closer to Germanic than Slavic peoples."
  UU_elb_mission_events.4.a:0 "Ok."
  UU_elb_mission_events.4.b:0 "This was a bad idea. Stop this while we still can."
 
 #Custom Tooltips
 uu_elbified_tt:0 "We will adopt a new primary culture in the §YGermanic§! culture group.\nCulture in all owned §YCzech§! and §YSaxon§! provinces will become §YElbian§!."
 uu_elb_again_tt:0 "§OOur Czech provinces will slowly assimilate into a new German culture for as long as we have any remaining Czech provinces.§!"
 uu_elb_national_supremacy_tt:0 "Every owned province of §YCzech§! culture gets '§YCzech National Supremacy§!' for §Y40 years§!, giving the following effects:\nLocal Unrest:§G -2.00§!\nDevelopment Cost:§G -5.0%§!\nLocal Manpower Modifier:§G +10.0%§!\n\nEvery owned province §RNOT§! in the §YWest Slavic§! culture group gets '§YCzech National Supremacy§!' for §Y40 years§!, giving the following effects:\nLocal Unrest:§R +3.00§!\nLocal Missionary Strength:§G +2.0%§!\nLocal Manpower Modifier:§R -10.0%§!\nCulture Conversion Cost:§G -25.0%§!"
 uu_elb_national_supremacy_2_tt:0 "Every owned province of §YCzech§! culture gets '§YCzech National Supremacy§!' for §Y40 years§!, giving the following effects:\nLocal Unrest:§G -2.00§!\nDevelopment Cost:§G -5.0%§!\nLocal Manpower Modifier:§G +10.0%§!"
 uu_elbification_stop_tt:0 "§YWe will put measures in place to preserve the Czech culture.§!" 


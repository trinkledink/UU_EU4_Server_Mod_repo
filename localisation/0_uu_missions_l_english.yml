 estate_burghers_elb_improved_workshops:0 "§OImproved Workshops§!"
 estate_burghers_elb_improved_workshops_desc:0 "Allow use of innovative tools for our workshops" 
 estate_burghers_elb_improved_workshops_mod:0 "Improved Workshops"
 estate_burghers_elb_improved_workshops_tooltip:0 "All Provinces with a §YWorkshop§! or §YCounting House§! will receive additional §G20% production efficiency§!" 
